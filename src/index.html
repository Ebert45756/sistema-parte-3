<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Avisos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📢 Sistema de Avisos</h1>
        <p>Gerencie e publique seus avisos</p>
    </header>

    <main class="container">

        <!-- Cadastro de aviso -->
        <section class="painel">

            <h2>Novo Aviso</h2>

            <form id="formAviso">

                <div class="formulario">

                    <div class="campo">
                        <label for="titulo">Título</label>

                        <input
                            type="text"
                            id="titulo"
                            placeholder="Digite o título do aviso"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="prioridade">Prioridade</label>

                        <select id="prioridade">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="data">Data</label>

                        <input
                            type="date"
                            id="data"
                            required
                        >
                    </div>

                    <div class="campo campo-completo">

                        <label for="descricao">Descrição</label>

                        <textarea
                            id="descricao"
                            placeholder="Digite o conteúdo do aviso..."
                            required
                        ></textarea>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn-adicionar"
                >
                    + Adicionar Aviso
                </button>

            </form>

        </section>


        <!-- Lista de avisos -->
        <section class="painel">

            <h2>Avisos Publicados</h2>

            <div class="filtros">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔎 Pesquisar avisos..."
                >

                <select id="filtroPrioridade">

                    <option value="todos">
                        Todas as prioridades
                    </option>

                    <option value="baixa">
                        Baixa
                    </option>

                    <option value="media">
                        Média
                    </option>

                    <option value="alta">
                        Alta
                    </option>

                </select>

            </div>

            <div id="listaAvisos"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
